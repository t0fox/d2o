name: d2o release
# Continuous delivery from main. Nobody starts a release by hand:
#
#   push to main → CI (ci.yml) → ci-ok green → this workflow
#     plan     scripts/release-plan.sh: is there a fix or a feature since the
#              last release? No → stop here, nothing is built.
#     build    nine CPUs in parallel, each tested under QEMU
#     publish  archives, latest.json, Ed25519 signature; a draft release,
#              then one switch makes it public and latest
#
# Routers take releases/latest/download/latest.json, check the signature with
# the pinned key and install the archive for their CPU (files/d2k-update.sh).
#
# The manual run (Actions → d2o release → Run workflow) stays for one case:
# release main now even without a fix or a feature.
on:
  workflow_call:
    inputs:
      notes:
        description: Release notes; empty means the fix/feat list.
        type: string
        required: false
  workflow_dispatch:
    inputs:
      notes:
        description: Что изменилось (покажется в панели). Пусто — список fix/feat с прошлого выпуска.
        type: string
        required: false

# Least privilege: only publish gets write access, and only it sees the key.
permissions:
  contents: read
  checks: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan — is there anything to release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      id: ${{ steps.plan.outputs.id }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      # Full history with tags: the plan counts commits since the last
      # release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Direct workflow_dispatch would bypass the CI gate in ci.yml.
      # Require a successful CI passed check on this exact main commit.
      - name: Require green CI for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI passed" and .conclusion == "success")] | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::This main commit has no successful 'CI passed' check; run the CI workflow first"
            exit 1
          fi
      - id: plan
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          NOTES: ${{ inputs.notes }}
        run: sh scripts/release-plan.sh

  build:
    name: Build — ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, arm, mipsel, mips, mips64el, amd64, x86, ppc64, riscv64]
    env:
      ARCHES: ${{ matrix.arch }}
      RELEASE_ID: ${{ needs.plan.outputs.id }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: QEMU and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make python3 qemu-user binutils file nodejs
      # No cache in a release build: a cache hit would skip the SHA-256 check.
      - uses: ./.github/actions/setup-zig
        with:
          version: '0.16.0'
          sha256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
          mips64el-version: '0.14.1'
          mips64el-sha256: '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c'
          cache: 'false'
      # OpenSSL for d2ktg is built from source here, also without a cache.
      # It took 26 of the 28 minutes when the nine CPUs ran one after another
      # (12.10.2026); in parallel the wall time is one CPU's share.
      - name: Build d2kd, d2kc, d2kpanel, d2ktg
        run: sh scripts/build-router.sh
      - name: Test the binaries under QEMU
        run: |
          sh scripts/build-router-tests.sh
          sh scripts/check-router-builds.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: builds/*-linux-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish — sign and release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: d2o-signing
    permissions:
      contents: write
    # One publish at a time. A newer one waits; it is not cancelled midway.
    concurrency:
      group: d2o-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      RELEASE_ID: ${{ needs.plan.outputs.id }}
      VERSION: ${{ needs.plan.outputs.version }}
      NOTES: ${{ needs.plan.outputs.notes }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/builds
          merge-multiple: true
      # The /tmp preflight numbers in scripts/install.sh are measured on the
      # real per-architecture set. A checkout does not carry one, so this is
      # the gate of record: the binaries here are the ones about to be
      # published, and a number that fell behind them stops the release
      # instead of breaking an install in the middle of a download.
      - name: The /tmp preflights still cover what is about to be published
        run: D2K_BUILDS="$RUNNER_TEMP/builds" sh scripts/test-install-manifest.sh
      - name: Archives, latest.json and signature
        env:
          PRIVATE_KEY: ${{ secrets.D2O_ED25519_PRIVATE_KEY }}
          PUBLIC_KEY_HEX: ${{ vars.D2O_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::D2O_ED25519_PRIVATE_KEY is empty: the d2o-signing environment secret did not reach this job (called from ci.yml without 'secrets: inherit'?)"
            exit 1
          fi
          if ! [[ "$PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::D2O_SIGNING_PUBLIC_KEY is missing or malformed"
            exit 1
          fi
          signing_pub=$(printf '%s\n' "$PRIVATE_KEY" | openssl pkey -pubout -outform DER 2>/dev/null | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          if [ "$signing_pub" != "$PUBLIC_KEY_HEX" ]; then
            echo "::error::d2o signing secret and public key do not match"
            exit 1
          fi
          out="$RUNNER_TEMP/release"
          # Artifacts do not keep the file mode; the archives must.
          chmod 0755 "$RUNNER_TEMP"/builds/*
          sh scripts/package-release.sh "$RUNNER_TEMP/builds" "$out"
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$PRIVATE_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$out/latest.json" -out "$out/latest.json.sig"
          # Verify with the same public key that the two scripts which
          # install a release pin: files/d2k-update.sh at night and
          # scripts/install.sh by hand. A key only one of them trusts would
          # leave half the routers unable to install anything.
          pub=$(python3 -c 'import base64,os; print(base64.b64encode(bytes.fromhex("302a300506032b6570032100"+os.environ["PUBLIC_KEY_HEX"])).decode())')
          for pinned in files/d2k-update.sh scripts/install.sh; do
            grep -qF "$pub" "$pinned" ||
              { echo "::error::$pinned pins a signing key other than D2O_SIGNING_PUBLIC_KEY"; exit 1; }
          done
          printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' "$pub" > "$RUNNER_TEMP/public.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/public.pem" -rawin \
            -in "$out/latest.json" -sigfile "$out/latest.json.sig"
      # WHY THE HEAD CHECK. GITHUB_TOKEN can never hold the "workflows"
      # permission (a platform rule). GitHub therefore refuses it a tag on a
      # commit whose .github/workflows differ from the default branch:
      # "HTTP 403: Resource not accessible by integration". 12.10.2026 one
      # release failed exactly so — main moved with a ci.yml change while it
      # built. A commit that is no longer the head of main is superseded: the
      # CI run of the newer head releases it. A personal token with the
      # "workflow" scope would also pass, but it is a long-lived secret with
      # the owner's rights, and the release does not need it.
      - name: Publish, unless main has moved on
        run: |
          set -euo pipefail
          superseded() {
            head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            [ "$head" != "$SHA" ] || return 1
            msg="main is at ${head:0:7} now, not at ${SHA:0:7}: the newer CI run releases it"
            if [ "$MANUAL" = true ]; then echo "::error::$msg"; exit 1; fi
            echo "::notice::$msg"
          }
          superseded && exit 0
          # A run cancelled between "draft" and "public" leaves its draft.
          # Only drafts of this workflow go: d2k-* and never published.
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | startswith("d2o-"))) | .tagName' |
            while read -r t; do gh release delete "$t" --yes; done
          out="$RUNNER_TEMP/release"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          # Draft first: a draft has no tag and no download link yet. Routers
          # see the release only after every asset is uploaded.
          gh release create "$RELEASE_ID" --draft --target "$SHA" \
            --title "d2o $VERSION" --notes-file "$RUNNER_TEMP/notes.txt" \
            "$out"/d2k-*.tar.gz "$out/latest.json" "$out/latest.json.sig"
          # The tag is made here. main can move in the seconds since the check.
          if ! gh release edit "$RELEASE_ID" --draft=false --latest; then
            gh release delete "$RELEASE_ID" --yes || true
            superseded && exit 0
            exit 1
          fi
          echo "::notice::released $RELEASE_ID"
