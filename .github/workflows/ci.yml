name: CI

# Pipeline order follows the usual industry rule: cheap checks first, and every
# expensive stage waits for them (fail fast).
#
#   1. lint, warnings  — seconds; nothing below starts until they pass
#   2. in parallel:
#        build        nine CPUs
#        unit         components; core split into shards by measured weight
#        sanitizers   ASan + UBSan
#        integration  scripts, panel in Chrome; install lifecycle needs build
#   3. ci-ok           — the single required status check
#
# Сборка подписанного релиза запускается вручную после зелёного CI на main.
#
# Wall time is the slowest job of stage 2 (~7-8 minutes), not the sum.
#
# Тяжёлая сборка релиза (OpenSSL для девяти архитектур) находится в release.yml
# и запускается только вручную.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# Новый push в ту же ветку делает старый CI неактуальным: проверять нужно верхушку.
# Отменяем старый запуск, чтобы новый не ждал в очереди.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
  ZIG_MIPS64EL_VERSION: '0.14.1'
  ZIG_MIPS64EL_SHA256: '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c'

jobs:
  # ── Stage 1: static checks ────────────────────────────────────────────────

  lint:
    name: Lint — shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # One list for CI and scripts/check.sh, kept in scripts/lint-shell.sh.
      # It also covers the extensionless scripts in files/ (S99d2k and the
      # rest), which a *.sh glob misses.
      - name: shellcheck
        run: sh scripts/lint-shell.sh
      - name: core shards cover all of check and san
        run: |
          sh scripts/ci-core-shard.sh verify
          sh scripts/ci-core-san-shard.sh verify

  warnings:
    name: Warnings — second compiler (gcc -Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - name: datapath
        run: make -C datapath gcc-warn GCC=gcc
      - name: core
        run: make -C core gcc-warn GCC=gcc
      - name: telegram
        run: make -C telegram gcc-warn

  differential:
    name: Differential — Telegram Rust/C
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.98.0
      - name: Install OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - name: Compare Rust/C MTProto crypto and framing
        run: python3 telegram/differential/run.py

  # ── Stage 2: build and unit tests ─────────────────────────────────────────

  build:
    name: Build — ${{ matrix.arch }}
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, arm, mipsel, mips, mips64el, amd64, x86, ppc64, riscv64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
          mips64el-version: ${{ env.ZIG_MIPS64EL_VERSION }}
          mips64el-sha256: ${{ env.ZIG_MIPS64EL_SHA256 }}
      - name: Build d2kd, d2kc and d2kpanel
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          . scripts/build-target.sh
          mkdir -p out
          for component in datapath core panel; do
            make -C "$component" release ARCH="$ARCH" TARGET="$TARGET" \
              TARGET_FLAGS="$TARGET_FLAGS" ZIG="$BUILD_ZIG" BUILDDIR="$PWD/out" \
              COMMIT="$GITHUB_SHA" BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" DIRTY=0 \
              RELEASE_ID=ci VERSION=ci
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d2o-ci-${{ matrix.arch }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  unit:
    name: Unit — ${{ matrix.component }}
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # core is split into shards by measured weight (scripts/ci-core-shard.sh):
      # one serial run took 18.8 minutes, the slowest shard takes ~6.5.
      matrix:
        include:
          - { component: datapath,     run: 'make -C datapath check' }
          - { component: core-sched,   run: 'sh scripts/ci-core-shard.sh sched' }
          - { component: core-modes,   run: 'sh scripts/ci-core-shard.sh sched-modes' }
          - { component: core-compose, run: 'sh scripts/ci-core-shard.sh compose-measured' }
          - { component: core-rest,    run: 'sh scripts/ci-core-shard.sh rest' }
          - { component: detect,       run: 'make -C detect check' }
          - { component: panel,        run: 'make -C panel test' }
          - { component: telegram,     run: 'make -C telegram test' }
          - { component: relay-enroll, run: 'make -C relay-enroll test' }
          - { component: relay-gate,   run: 'make -C relay-gate test' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
          mips64el-version: ${{ env.ZIG_MIPS64EL_VERSION }}
          mips64el-sha256: ${{ env.ZIG_MIPS64EL_SHA256 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: ${{ matrix.run }}
        run: ${{ matrix.run }}

  # ── Stage 3: sanitizers and integration ───────────────────────────────────

  sanitizers:
    name: Sanitizers — ${{ matrix.component }}
    # Same test level as unit, so it runs beside unit, not after it: both are
    # gated by the cheap stage 1 checks. Wall time is max(unit, san), not sum.
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # core is split by measured weight (scripts/ci-core-san-shard.sh): one
      # serial run took 22.4 minutes, the slowest shard takes ~7.
      matrix:
        include:
          - { component: datapath,       run: 'make -C datapath san' }
          - { component: panel,          run: 'make -C panel san' }
          - { component: core-sched,     run: 'sh scripts/ci-core-san-shard.sh sched' }
          - { component: core-compose,   run: 'sh scripts/ci-core-san-shard.sh compose' }
          - { component: core-rest-1,    run: 'sh scripts/ci-core-san-shard.sh rest-1' }
          - { component: core-rest-2,    run: 'sh scripts/ci-core-san-shard.sh rest-2' }
          - { component: telegram,       run: 'make -C telegram san' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL headers for Telegram
        if: matrix.component == 'telegram'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - name: ${{ matrix.run }}
        run: ${{ matrix.run }}

  integration-scripts:
    name: Integration — installer, updater, firewall scripts
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox
      # Integration tests run against built code, not source. The controller
      # handshake test starts the real core/d2kc.
      - name: Build the controller
        run: make -C core d2kc
      # Every scripts/test-* runs. A hand-picked list drifts away from the
      # tree; discovery does not. All tests run even after a failure, and
      # every failure is named at the end: stopping at the first one hides the
      # rest behind another push.
      - name: Run every scripts/test-*
        run: |
          set -uo pipefail
          shopt -s nullglob
          failed=()
          for t in scripts/test-*.sh scripts/test-*.cjs; do
            echo "::group::$t"
            case "$t" in *.cjs) node "$t" ;; *) sh "$t" ;; esac || failed+=("$t")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::failed: %s\n' "${failed[@]}"
            exit 1
          fi

  integration-install:
    name: Integration — install, upgrade, uninstall (ARM64 container)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load netfilter modules on the host
        # A container cannot load kernel modules; the installer requires them.
        run: sudo modprobe -a nfnetlink_queue xt_NFQUEUE xt_connbytes xt_multiport xt_mark xt_connmark xt_conntrack xt_addrtype xt_comment ip6table_mangle
      - name: Lifecycle in a disposable container
        run: sh scripts/lab-install.sh

  integration-panel:
    name: Integration — panel in Chrome
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D2K_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: Build the panel
        run: make -C panel d2kpanel
      - name: Rendering, controls and layout
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          D2K_CAPTURE_DIR: ${{ runner.temp }}/panel-browser
        run: |
          set -euo pipefail
          mkdir -p "$D2K_CAPTURE_DIR"
          node panel/test_browser.cjs 2>&1 | tee "$D2K_CAPTURE_DIR/browser.log"
      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-browser
          path: ${{ runner.temp }}/panel-browser
          retention-days: 7

  # ── Stage 4: the single required check ────────────────────────────────────

  ci-ok:
    name: CI passed
    # Branch protection requires THIS job only. Adding or renaming jobs above
    # then needs no change in repository settings.
    if: always()
    needs: [lint, warnings, build, unit, sanitizers, integration-scripts, integration-install, integration-panel, differential]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped job counts as a failure: when build fails, the jobs that
      # need it are skipped, and the gate must not turn green on that.
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - name: All required jobs succeeded
        run: echo "CI passed"
